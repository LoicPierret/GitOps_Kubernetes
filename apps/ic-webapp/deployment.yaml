apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    env: prod
    app: ic-webapp
  name: ic-webapp
  namespace: ic-webapp
spec:
  # Plancher géré par le HorizontalPodAutoscaler (hpa.yaml) : ArgoCD ignore
  # nativement les écarts sur spec.replicas quand un HPA cible la ressource,
  # cette valeur ne sera donc pas réécrasée à chaque sync. 2 (pas 1) pour que
  # le PodDisruptionBudget (pdb.yaml, minAvailable: 1) ait un sens réel —
  # avec 1 seul replica, ce PDB bloquerait indéfiniment toute éviction
  # volontaire (dont les consolidations Karpenter).
  replicas: 2
  selector:
    matchLabels:
      app: ic-webapp
  template:
    metadata:
      labels:
        app: ic-webapp
    spec:
      containers:
        # Tag géré par la CI (.github/workflows/deploy.yml, job
        # update-gitops) : écrit ici le SHA du commit à chaque déploiement.
        # Ne pas éditer cette ligne à la main.
        - image: azeriock/ic-webapp:1f6de36a6e82d1be1579884e262cb5816def09be
          name: ic-webapp
          env:
            - name: ODOO_URL
              value: "https://odoo.nuages.click"
            - name: PGADMIN_URL
              value: "https://pgadmin.nuages.click"
          ports:
            - containerPort: 8080
              name: ic-webapp
          # Requêtes obligatoires pour que le HPA (hpa.yaml) puisse calculer
          # un pourcentage d'utilisation CPU ; limits en garde-fou contre un
          # emballement qui affamerait le nœud système.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
