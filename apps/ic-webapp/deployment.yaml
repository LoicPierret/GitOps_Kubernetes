apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    env: prod
    app: ic-webapp
  name: ic-webapp
  namespace: ic-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-webapp
  template:
    metadata:
      labels:
        app: ic-webapp
    spec:
      containers:
        # Tag géré par la CI (.github/workflows/deploy.yml, job
        # update-gitops) : écrit ici le SHA du commit à chaque déploiement.
        # Ne pas éditer cette ligne à la main.
        - image: azeriock/ic-webapp:8b78a1e788a8799b86c884693b238ae38d1ef5e9
          name: ic-webapp
          env:
            - name: ODOO_URL
              value: "https://odoo.nuages.click"
            - name: PGADMIN_URL
              value: "https://pgadmin.nuages.click"
          ports:
            - containerPort: 8080
              name: ic-webapp
