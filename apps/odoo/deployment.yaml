apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  labels:
    app: odoo
    env: prod
  namespace: ic-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      securityContext:
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
      containers:
        - image: odoo
          name: odoo
          args: ["-i", "base"]
          envFrom:
            - configMapRef:
                name: odoo-config
          env:
            - name: PGDATABASE
              value: "odoo"
            - name: PGSSLMODE
              value: "require"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret "odoo" créé par l'ExternalSecret ci-contre
                  # (external-secret.yaml), à partir du mot de passe RDS
                  # géré par AWS (Secrets Manager). Clé "password" en
                  # minuscule : nom du champ JSON du secret RDS, recopié tel
                  # quel par External Secrets Operator (dataFrom.find).
                  name: odoo
                  key: password
          ports:
            - containerPort: 8069
              name: odoo
          volumeMounts:
            - name: lib-odoo-persistent-storage
              mountPath: /var/lib/odoo
      volumes:
        - name: lib-odoo-persistent-storage
          persistentVolumeClaim:
            claimName: odoo-pvc
