# Recopie le mot de passe RDS dans un Secret Kubernetes "odoo".
#
# "odoo-db-password" est généré et nommé par Terraform (terraform/app,
# external-secrets.tf, random_password.odoo_db) plutôt que délégué à RDS :
# ça permet de choisir ce nom fixe une fois pour toutes, jamais à modifier
# ici même si l'instance RDS est détruite et recréée.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: odoo
  namespace: ic-webapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: odoo
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: odoo-db-password
