# Recopie le mot de passe RDS (généré et géré par AWS, jamais choisi ni
# stocké par nous) dans un Secret Kubernetes "odoo". Le secret source dans
# Secrets Manager porte un nom auto-généré par RDS (rds!db-<uuid>, différent
# à chaque instance) : on le retrouve par motif de nom plutôt que par nom
# exact. Ce motif est spécifique aux secrets gérés par RDS (préfixe "rds!"),
# rien d'autre dans le compte ne l'utilise.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: odoo
  namespace: ic-webapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: odoo
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^rds!db-"
