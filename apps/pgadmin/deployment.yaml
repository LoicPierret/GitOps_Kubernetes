apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin
  labels:
    app: pg-admin
    env: prod
  namespace: ic-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin
  template:
    metadata:
      labels:
        app: pg-admin
    spec:
      securityContext:
        fsGroup: 5050
        runAsUser: 5050
        runAsGroup: 5050
      containers:
        - image: dpage/pgadmin4
          name: pg-admin
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: pgadmin@pgadmin.com
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret "pgadmin-secret" (clé PGADMIN_DEFAULT_PASSWORD) :
                  # non défini dans ce dépôt (public), voir
                  # apps/pgadmin/README.md pour la marche à suivre en
                  # attendant la phase 3 (External Secrets).
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_PASSWORD
          ports:
            - containerPort: 80
              name: pg-admin
          volumeMounts:
            - name: pg-admin-data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pg-admin-data
          persistentVolumeClaim:
            claimName: pgadmin-pvc
