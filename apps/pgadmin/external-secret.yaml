# Recopie le mot de passe pgAdmin (généré par Terraform, stocké dans Secrets
# Manager sous un nom fixe) dans un Secret Kubernetes "pgadmin-secret".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgadmin-secret
  namespace: ic-webapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: pgadmin-secret
    creationPolicy: Owner
  data:
    - secretKey: PGADMIN_DEFAULT_PASSWORD
      remoteRef:
        key: pgadmin-admin-password
